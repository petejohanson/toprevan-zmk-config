# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: calvin_toprevan
  - board: calvin_toprevan
    snippet: enable_ec_calibrator
    artifact-name: calvin_toprevan_calibrator
  - board: calvin_toprevan
    snippet: zmk-usb-logging
    artifact-name: calvin_toprevan_logging
    cmake-args: -DCONFIG_ZMK_USB=n -DCONFIG_FPU=n -DCONFIG_RETAINED_MEM=n -DCONFIG_RETENTION=n -DCONFIG_ZMK_PHYSICAL_LAYOUT_KEY_ROTATION=n -DCONFIG_ZMK_BOOTMODE_TO_MAGIC_VALUE_MAPPER=n -DCONFIG_USB_WORKQUEUE=n -DCONFIG_HWINFO=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000 -DCONFIG_NVS_LOG_LEVEL_DBG=y -DCONFIG_FLASH_LOG_LEVEL_DBG=y -DCONFIG_ZMK_LOGGING_MINIMAL=y
